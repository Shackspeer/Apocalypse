<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
    <title>Apocalypse</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: #0d0d0f;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }
        .bg-glow {
            position: absolute;
            width: 350px; height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(120,60,200,0.18) 0%, transparent 70%);
            animation: pulse-glow 2s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,100% { transform: scale(1); opacity: 0.6; }
            50%     { transform: scale(1.15); opacity: 1; }
        }
        .icon-wrapper {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 36px;
            animation: icon-appear 0.7s cubic-bezier(0.34,1.56,0.64,1) forwards;
            opacity: 0;
        }
        @keyframes icon-appear {
            0%   { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        .icon-wrapper img {
            width: 120px; height: 120px;
            object-fit: contain;
            border-radius: 24px;
            filter: drop-shadow(0 0 28px rgba(155,89,245,0.55));
        }
        .spinner {
            width: 54px; height: 54px;
            animation: fade-in 0.4s 0.6s ease forwards;
            opacity: 0;
        }
        @keyframes fade-in { to { opacity: 1; } }
        .spinner svg { width: 100%; height: 100%; animation: rotate 1.2s linear infinite; }
        @keyframes rotate { to { transform: rotate(360deg); } }
        .spinner svg circle {
            fill: none; stroke-width: 3.5; stroke-linecap: round;
            stroke-dasharray: 100; stroke-dashoffset: 75;
            stroke: url(#sg);
            animation: dash 1.2s ease-in-out infinite;
        }
        @keyframes dash {
            0%   { stroke-dashoffset: 100; }
            50%  { stroke-dashoffset: 25; }
            100% { stroke-dashoffset: 100; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="icon-wrapper">
        <img src="./icon.png" alt="Apocalypse" />
    </div>
    <div class="spinner">
        <svg viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#9b59f5;stop-opacity:1"/>
                    <stop offset="100%" style="stop-color:#e040fb;stop-opacity:1"/>
                </linearGradient>
            </defs>
            <circle cx="19" cy="19" r="15"/>
        </svg>
    </div>
</body>
</html>
